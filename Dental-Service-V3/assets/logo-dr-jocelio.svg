<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="logoTitle">
  <title id="logoTitle">Logotipo Dr. Jocélio — monograma DJ com coroa dentária em contragrafismo</title>
  <defs>
    <linearGradient id="azulMarca" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2375E5"/>
      <stop offset="100%" stop-color="#1765C5"/>
    </linearGradient>
    <clipPath id="recorteD">
      <path d="M62 42 h34 a58 58 0 0 1 0 116 h-34 z"/>
    </clipPath>
  </defs>

  <!-- Anel externo -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="url(#azulMarca)" stroke-width="5"/>

  <!-- Coroa dentária em contragrafismo dentro do bojo do D -->
  <g clip-path="url(#recorteD)">
    <path d="M76 78
             c0 -7 5.5 -12 12 -12
             c5 0 8 2.6 12 2.6
             c4 0 7 -2.6 12 -2.6
             c6.5 0 12 5 12 12
             c0 10 -3.4 17 -5.4 26
             c-1.6 7 -1.2 13 -3.6 13
             c-2.6 0 -2.4 -9.4 -5.4 -15.4
             c-1.8 -3.6 -4.6 -3.6 -6.4 0
             c-3 6 -2.8 15.4 -5.4 15.4
             c-2.4 0 -2 -6 -3.6 -13
             c-2 -9 -5.4 -16 -5.4 -26 z"
          fill="#FFFFFF"/>
  </g>

  <!-- Traço do D + cauda do J em um só movimento -->
  <path d="M62 42 h34 a58 58 0 0 1 0 116 h-34"
        fill="none" stroke="url(#azulMarca)" stroke-width="11"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Cauda do J saindo do eixo do D -->
  <path d="M148 60 v78 c0 24 -14 36 -34 36 c-17 0 -28 -8 -32 -21"
        fill="none" stroke="url(#azulMarca)" stroke-width="11"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
